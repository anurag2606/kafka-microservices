apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
spec:
  replicas: 2

  selector:
    matchLabels:
      app: order-service

  template:
    metadata:
      labels:
        app: order-service

    spec:
      containers:
        - name: order-service
          image: order-service:1.0
          ports:
            - containerPort: 8081

          env:
            - name: SPRING_KAFKA_PRODUCER_BOOTSTRAP_SERVERS
              value: kafka:9093

---
apiVersion: v1
kind: Service
metadata:
  name: order-service
spec:
  selector:
    app: order-service

  ports:
    - port: 8081
      targetPort: 8081

  type: NodePort
name: Kafka Microservices CI

on:

  push:
    branches:
      - '**'

  pull_request:
    branches:
      - master
      - main

jobs:

  order-service:
    name: Order Service
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build and Test
        working-directory: Order
        run: mvn clean verify


  payment-service:
    name: Payment Service
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build and Test
        working-directory: Payment
        run: mvn clean verify


  notification-service:
    name: Notification Service
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build and Test
        working-directory: Notification
        run: mvn clean verify


  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest

    needs:
      - order-service
      - payment-service
      - notification-service

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build Order Image
        run: docker build -t order-service ./Order

      - name: Build Payment Image
        run: docker build -t payment-service ./Payment

      - name: Build Notification Image
        run: docker build -t notification-service ./Notification